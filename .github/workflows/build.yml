name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan build manual dari tab Actions

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and Find Project Root
        run: |
          # 1. Jika file zip di-upload langsung, ekstrak dulu
          if ls *.zip 1> /dev/null 2>&1; then
            echo "File .zip ditemukan. Mengekstrak..."
            unzip -q *.zip -d temp_extract
            rm *.zip
          fi
          
          # 2. Cari di folder mana file pubspec.yaml berada
          PUBSPEC_PATH=$(find . -name pubspec.yaml | head -n 1)
          
          if [ -n "$PUBSPEC_PATH" ]; then
            PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
            echo "Proyek Flutter ditemukan di: $PROJECT_DIR"
            
            # 3. Jika lokasinya bukan di root, pindahkan semua isinya ke root
            if [ "$PROJECT_DIR" != "." ] && [ "$PROJECT_DIR" != "./" ]; then
              echo "Memindahkan file ke luar (ke root repository)..."
              cp -a "$PROJECT_DIR"/. .
              rm -rf "$PROJECT_DIR"
            fi
            
            echo "Struktur file siap di-build:"
            ls -la
          else
            echo "ERROR: pubspec.yaml tidak ditemukan! Pastikan file proyek ter-upload."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK release
        run: |
          # Perbaikan untuk masalah folder Android lama (v1 embedding)
          rm -rf android/build android/app/build || true
          
          # Generate icon dilakukan di background untuk menghindari error iOS
          dart run flutter_launcher_icons || true
          
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
