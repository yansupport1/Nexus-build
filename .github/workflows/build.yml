name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bersihkan Kode Lama & Ekstrak ZIP Terbaru
        run: |
          # 1. Hapus sisa-sisa source code lama agar tidak bentrok
          echo "Membersihkan workspace dari kode lama..."
          rm -rf lib android ios web pubspec.yaml pubspec.lock extracted_project temp_extract
          
          # 2. Cari file ZIP yang Paling Baru di-upload
          ZIP_FILE=$(ls -t *.zip | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "Ditemukan ZIP terbaru: $ZIP_FILE"
            echo "Mengekstrak..."
            unzip -q -o "$ZIP_FILE" -d extracted_project
            
            # 3. Cari dimana letak pubspec.yaml
            PUBSPEC_PATH=$(find extracted_project -name pubspec.yaml | head -n 1)
            
            if [ -n "$PUBSPEC_PATH" ]; then
              PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
              echo "Memindahkan kode dari dalam folder ke depan..."
              cp -a "$PROJECT_DIR"/. .
              rm -rf extracted_project
            else
              echo "ERROR: pubspec.yaml tidak ada di dalam ZIP!"
              exit 1
            fi
          else
            echo "ERROR: Tidak ada file .zip yang di-upload di repository!"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bikin Folder Android Fresh & Inject Izin Overlay
        run: |
          # Bikin ulang sistem Android
          rm -rf android
          flutter create --platforms android .
          
          # Suntik Perizinan Overlay & Notifikasi ke AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          
          sed -i '/<application/i \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n' $MANIFEST_PATH
          
          sed -i '/<\/application>/i \        <service android:name="flutter.overlay.window.flutter_overlay_window.OverlayService" android:exported="false" android:foregroundServiceType="specialUse" />\n' $MANIFEST_PATH

      - name: Get dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
