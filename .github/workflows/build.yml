name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan build manual dari tab Actions

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP File (If Uploaded as ZIP)
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Menemukan file .zip, mengekstrak..."
            unzip -q *.zip -d extracted_project
            # Pindahkan semua isi dari dalam folder (jika zip terbungkus 1 folder utama)
            if [ -d "extracted_project/nexus-tools-flutter-apk-project" ]; then
                mv extracted_project/nexus-tools-flutter-apk-project/* . || true
                mv extracted_project/nexus-tools-flutter-apk-project/.* . 2>/dev/null || true
            else
                mv extracted_project/* . || true
                mv extracted_project/.* . 2>/dev/null || true
            fi
            rm -rf extracted_project *.zip
            echo "Ekstraksi selesai. Isi root sekarang:"
            ls -la
          else
            echo "Tidak ada file ZIP yang ditemukan. Melanjutkan dengan struktur repository saat ini."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons || true

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
