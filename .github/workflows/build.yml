name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP File
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q *.zip -d temp_extract
            rm *.zip
          fi
          PUBSPEC_PATH=$(find . -name pubspec.yaml | head -n 1)
          if [ -n "$PUBSPEC_PATH" ]; then
            PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
            if [ "$PROJECT_DIR" != "." ] && [ "$PROJECT_DIR" != "./" ]; then
              cp -a "$PROJECT_DIR"/. .
              rm -rf "$PROJECT_DIR"
            fi
          else
            echo "ERROR: pubspec.yaml tidak ditemukan!"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Fresh Android Folder (The Ultimate Fix)
        run: |
          # 1. Hapus folder android lama yang cacat
          rm -rf android
          
          # 2. Suruh Flutter bikin folder android baru yang 100% sempurna
          flutter create --platforms android .

      - name: Get dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
