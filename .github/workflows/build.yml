name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP File
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q *.zip -d temp_extract
            rm *.zip
          fi
          PUBSPEC_PATH=$(find . -name pubspec.yaml | head -n 1)
          if [ -n "$PUBSPEC_PATH" ]; then
            PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
            if [ "$PROJECT_DIR" != "." ] && [ "$PROJECT_DIR" != "./" ]; then
              cp -a "$PROJECT_DIR"/. .
              rm -rf "$PROJECT_DIR"
            fi
          else
            echo "ERROR: pubspec.yaml tidak ditemukan!"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Android Folder & Inject Overlay Permissions
        run: |
          # 1. Bikin ulang sistem Android
          rm -rf android
          flutter create --platforms android .
          
          # 2. Suntik Perizinan Overlay & Notifikasi ke AndroidManifest.xml
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          
          sed -i '/<application/i \    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n' $MANIFEST_PATH
          
          sed -i '/<\/application>/i \        <service android:name="flutter.overlay.window.flutter_overlay_window.OverlayService" android:exported="false" android:foregroundServiceType="specialUse" />\n' $MANIFEST_PATH

      - name: Get dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build APK release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
